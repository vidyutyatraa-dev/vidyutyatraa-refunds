<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
 name="viewport"
 content="width=device-width, initial-scale=1.0">

<title>Refund Management</title>

<style>

/* =========================================================
   BASE THEME
   Matches charger-status.html
   ========================================================= */

body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background:
        radial-gradient(
            circle at top,
            #064e3b,
            #020617
        );
    color: #e2e8f0;
    min-height: 100vh;
}

/* =========================================================
   MAIN CONTAINER
   ========================================================= */

.container {

    width: calc(100% - 40px);
    max-width: 1500px;

    margin: auto;

    padding:
        10px 20px 30px;

    box-sizing: border-box;
}

/* =========================================================
   LOGO
   ========================================================= */

.logo {

    width: 160px;

    margin:
        10px auto 20px;

    display: block;
}

/* =========================================================
   NAVIGATION
   ========================================================= */

.nav-btn {

    width: 100%;

    padding: 10px;

    border: none;

    border-radius: 10px;

    font-size: 14px;

    cursor: pointer;

    margin-bottom: 12px;

    background: #334155;

    color: white;
}

.nav-btn:hover {
    background: #475569;
}

/* =========================================================
   CARD
   ========================================================= */

.card {

    background: #1e293b;

    border-radius: 16px;

    padding: 16px;

    margin-bottom: 16px;

    box-shadow:
        0 6px 20px rgba(0,0,0,0.3);

    box-sizing: border-box;
}

/* =========================================================
   TITLE
   ========================================================= */

.title {

    font-size: 20px;

    font-weight: bold;

    margin-bottom: 10px;
}

/* =========================================================
   FILTER CARD
   ========================================================= */

.filter-card {
    text-align: left;
}

.filter-heading {

    font-size: 18px;

    font-weight: bold;

    margin-bottom: 14px;
}

/*
 * Two-row filter layout:
 *
 * Row 1 = headings
 * Row 2 = controls
 */

.filter-grid {

    display: grid;

    grid-template-columns:
        1.2fr
        1.5fr
        1.5fr
        1.4fr
        1.5fr
        1.2fr;

    column-gap: 12px;

    row-gap: 6px;

    align-items: end;
}

.filter-label {

    font-size: 13px;

    color: #94a3b8;

    font-weight: 600;

    padding-left: 2px;
}

.filter-control {

    width: 100%;

    box-sizing: border-box;

    padding: 9px 10px;

    border: 1px solid #475569;

    border-radius: 8px;

    background: #0f172a;

    color: #e2e8f0;

    font-family:
        'Segoe UI',
        sans-serif;

    font-size: 14px;

    outline: none;
}

.filter-control:focus {

    border-color: #38bdf8;

    box-shadow:
        0 0 0 2px
        rgba(56,189,248,0.15);
}

.filter-control::placeholder {
    color: #64748b;
}

/* =========================================================
   DATE RANGE
   ========================================================= */

.date-range {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 6px;
}

/* =========================================================
   AMOUNT FILTER
   ========================================================= */

.amount-filter {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 6px;
}

.amount-filter.single-value {
    grid-template-columns: 1fr;
}

/* =========================================================
   FILTER ACTIONS
   ========================================================= */

.filter-actions {

    display: flex;

    justify-content:
        flex-end;

    gap: 10px;

    margin-top: 16px;
}

button {

    padding: 10px 16px;

    border: none;

    border-radius: 10px;

    font-size: 14px;

    cursor: pointer;
}

.btn {

    box-shadow:
        0 6px 20px
        rgba(0,0,0,0.4);
}

.primary {

    background: #22c55e;

    color: black;
}

.primary:hover {
    background: #16a34a;
}

.secondary {

    background: #38bdf8;

    color: black;
}

.secondary:hover {
    background: #0ea5e9;
}

/* =========================================================
   REFUND STATUS SELECT
   ========================================================= */

.status-select {
    min-height: 38px;
}

/* =========================================================
   RESULTS CARD
   ========================================================= */

.results-card {

    overflow-x: auto;

    text-align: left;
}

.results-header {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    margin-bottom: 12px;
}

.results-count {

    color: #94a3b8;

    font-size: 13px;
}

/* =========================================================
   TABLE
   ========================================================= */

.refund-table {

    width: 100%;

    border-collapse:
        separate;

    border-spacing: 0;

    font-size: 13px;

    min-width: 1100px;
}

.refund-table th {

    background: #0f172a;

    color: #cbd5e1;

    padding: 12px 10px;

    text-align: left;

    font-weight: 600;

    border-bottom:
        1px solid #475569;

    white-space: nowrap;
}

.refund-table td {

    padding: 11px 10px;

    border-bottom:
        1px solid #334155;

    vertical-align: middle;
}

.refund-table tbody tr:hover {

    background:
        rgba(51,65,85,0.45);
}

/* =========================================================
   SORT HEADINGS
   ========================================================= */

.sort-header {

    cursor: pointer;

    user-select: none;
}

.sort-header:hover {
    color: #38bdf8;
}

.sort-indicator {

    margin-left: 5px;

    color: #38bdf8;
}

/* =========================================================
   REFUND STATUS
   ========================================================= */

.status-badge {

    display: inline-block;

    padding: 4px 8px;

    border-radius: 8px;

    font-size: 12px;

    font-weight: 600;
}

.status-initiated {

    background: #7c2d12;

    color: #fed7aa;
}

.status-approved {

    background: #065f46;

    color: #bbf7d0;
}

.status-settled {

    background: #1e40af;

    color: #bfdbfe;
}

.status-rejected {

    background: #7f1d1d;

    color: #fecaca;
}

/* =========================================================
   ERROR / REASON
   ========================================================= */

.refund-error {

    color: #fca5a5;

    max-width: 260px;

    line-height: 1.4;
}

/* =========================================================
   APPROVE BUTTON
   ========================================================= */

.approve-btn {

    background: #22c55e;

    color: black;

    padding:
        7px 12px;

    border-radius: 8px;

    font-size: 12px;

    box-shadow: none;
}

/* =========================================================
   REJECT BUTTON
   ========================================================= */

   .reject-btn {

    background: #ef4444;

    color: white;

    padding:
        7px 12px;

    border-radius: 8px;

    font-size: 12px;

    box-shadow: none;
}

/* =========================================================
   CANCEL BUTTON
   ========================================================= */

   .cancel-btn {

    background: #f59e0b;

    color: #020617;

    padding:
        7px 12px;

    border-radius: 8px;

    font-size: 12px;

    box-shadow: none;
}

/* =========================================================
   LOADING
   ========================================================= */

.loading {

    text-align: center;

    padding: 30px;

    color: #94a3b8;
}

/* =========================================================
   EMPTY STATE
   ========================================================= */

.empty-state {

    text-align: center;

    padding: 40px;

    color: #94a3b8;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 1100px) {

    .filter-grid {

        grid-template-columns:
            repeat(3, 1fr);
    }
}

@media (max-width: 700px) {

    .container {

        width: 100%;

        padding:
            10px 12px 25px;
    }

    .filter-grid {

        grid-template-columns:
            1fr;
    }

    .filter-actions {

        flex-direction:
            column;
    }

    .filter-actions button {

        width: 100%;
    }

    .results-card {

        padding: 10px;
    }
}

/* -------------------------------------------------
   REMARKS
   ------------------------------------------------- */

.remarks-cell {
    min-width: 180px;
}

.show-remarks-link {
    display: block;
    color: #38bdf8;
    cursor: pointer;
    text-decoration: underline;
    margin-bottom: 8px;
    font-size: 13px;
}

.show-remarks-link:hover {
    color: #7dd3fc;
}

.new-remark-input {
    width: 100%;
    box-sizing: border-box;
    background: #0f172a;
    color: #e2e8f0;
    border: 1px solid #475569;
    border-radius: 8px;
    padding: 8px;
    resize: vertical;
    font-family: inherit;
    font-size: 12px;
}

.new-remark-input:focus {
    outline: none;
    border-color: #38bdf8;
}


/* -------------------------------------------------
   REMARKS MODAL
   ------------------------------------------------- */

.remarks-modal {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(0, 0, 0, 0.65);

    z-index: 1000;
}

.remarks-modal-content {
    width: min(650px, 90vw);
    max-height: 80vh;

    background: #1e293b;
    color: #e2e8f0;

    border-radius: 14px;

    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);

    overflow: hidden;
}

.remarks-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 14px 18px;

    background: #334155;

    font-size: 16px;
    font-weight: 600;
}

.remarks-close-btn {
    border: none;
    background: transparent;

    color: #e2e8f0;

    font-size: 24px;
    line-height: 1;

    cursor: pointer;
}

.remarks-close-btn:hover {
    color: #38bdf8;
}

.remarks-list {
    padding: 16px;

    max-height: 65vh;
    overflow-y: auto;
}

.remark-item {
    padding: 12px;

    margin-bottom: 10px;

    background: #0f172a;

    border-radius: 8px;

    border: 1px solid #334155;
}

.remark-meta {
    display: flex;
    justify-content: space-between;
    gap: 12px;

    margin-bottom: 6px;

    color: #94a3b8;

    font-size: 11px;
}

.remark-text {
    color: #e2e8f0;

    font-size: 13px;

    white-space: pre-wrap;
    word-break: break-word;
}

.no-remarks {
    color: #94a3b8;
    text-align: center;
    padding: 20px;
}

/* -------------------------------------------------
   TRANSACTION HISTORY PREVIEW
   ------------------------------------------------- */

.email-history-link {
    color: #38bdf8;
    text-decoration: underline;
    cursor: pointer;
}

.email-history-link:hover {
    color: #7dd3fc;
}

.transaction-history-preview {
    position: fixed;
    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    background: rgba(0, 0, 0, 0.55);

    z-index: 2000;
}

.transaction-history-preview-content {
    width: min(900px, 90vw);
    max-height: 80vh;

    background: #1e293b;

    border-radius: 16px;

    box-shadow:
        0 10px 40px
        rgba(0, 0, 0, 0.5);

    overflow: hidden;
}

.transaction-history-header {
    display: flex;

    align-items: center;
    justify-content: space-between;

    padding: 14px 18px;

    background: #334155;

    font-weight: 600;
}

.transaction-history-close {
    border: none;

    background: transparent;

    color: #e2e8f0;

    font-size: 24px;

    cursor: pointer;
}

.transaction-history-close:hover {
    color: #38bdf8;
}

#transactionHistoryPreviewBody {
    padding: 16px;

    max-height: 65vh;

    overflow-y: auto;
}

.transaction-history-table {
    width: 100%;

    border-collapse: collapse;

    font-size: 13px;
}

.transaction-history-table th {
    padding: 10px;

    background: #334155;

    text-align: left;

    white-space: nowrap;
}

.transaction-history-table td {
    padding: 10px;

    border-bottom:
        1px solid #334155;
}

.transaction-credit {
    color: #22c55e;
    font-weight: 600;
}

.transaction-debit {
    color: #f87171;
    font-weight: 600;
}

.no-transaction-history {
    text-align: center;

    color: #94a3b8;

    padding: 25px;
}

</style>

</head>

<body>

<div class="container">

<!-- =====================================================
     LOGO
     ===================================================== -->

<img
    src="https://vidyutyatraa.s3.ap-south-1.amazonaws.com/vy_logo_cropped_lite.png"
    class="logo"
    alt="VidyutYatraa">


<!-- =====================================================
     HOME
     ===================================================== -->

<button
    class="nav-btn"
    onclick="goHome()">

    ← Home

</button>


<!-- =====================================================
     PAGE TITLE
     ===================================================== -->

<div class="card">

    <div class="title">
        💳 Refund Management
    </div>

</div>


<!-- =====================================================
     FILTER CARD
     ===================================================== -->

<div class="card filter-card">

    <div class="filter-heading">
        Filters
    </div>


    <!-- ================================
         FILTER HEADINGS
         ================================ -->

    <div class="filter-grid">

        <div class="filter-label">
            Refund ID
        </div>

        <div class="filter-label">
            Email
        </div>

        <div class="filter-label">
            Filed On
        </div>

        <div class="filter-label">
            Refund Amount
        </div>

        <div class="filter-label">
            Description
        </div>

        <div class="filter-label">
            Refund Status
        </div>

        <!-- ================================
             FILTER VALUES
             ================================ -->

        <div>

            <input
                id="refundId"
                class="filter-control"
                type="text"
                placeholder="Refund ID">

        </div>


        <div>

            <input
                id="email"
                class="filter-control"
                type="text"
                placeholder="Email">

        </div>


        <div class="date-range">

            <input
                id="filedOnFrom"
                class="filter-control"
                type="datetime-local"
                title="Filed On From">

            <input
                id="filedOnTo"
                class="filter-control"
                type="datetime-local"
                title="Filed On To">

        </div>


        <div class="amount-filter">

            <select
                id="amountOperator"
                class="filter-control"
                onchange="updateAmountControls()">

                <option value="equal">
                    Equal
                </option>

                <option value="greater">
                    Greater Than
                </option>

                <option value="less">
                    Less Than
                </option>

                <option value="between">
                    Between
                </option>

            </select>

            <input
                id="amountValue1"
                class="filter-control"
                type="number"
                min="0"
                step="0.01"
                placeholder="Amount">

        </div>


        <div>

            <input
                id="description"
                class="filter-control"
                type="text"
                placeholder="Description">

        </div>

        <div>

            <select
                id="refundStatus"
                class="filter-control status-select">

                <option value="all">
                    All
                </option>

                <option value="Initiated"
                        selected>
                    Initiated
                </option>

                <option value="Approved">
                    Approved
                </option>

                <option value="Settled">
                    Settled
                </option>

                <option value="Rejected">
                    Rejected
                </option>

            </select>

        </div>

    </div>


    <!-- =================================================
         FILTER BUTTONS
         ================================================= -->

    <div class="filter-actions">

        <button
            class="secondary btn"
            onclick="resetFilters()">

            Reset

        </button>

        <button
            class="primary btn"
            onclick="applyFilters()">

            Apply Filters

        </button>

    </div>

</div>


<!-- =====================================================
     RESULTS
     ===================================================== -->

<div class="card results-card">

    <div class="results-header">

        <div class="title"
             style="margin-bottom:0;">

            Refunds

        </div>

        <div
            id="resultsCount"
            class="results-count">

            0 records

        </div>

    </div>


    <div id="tableContainer">

        <div class="loading">

            Loading refunds...

        </div>

    </div>

    <div
    id="transactionHistoryPreview"
    class="transaction-history-preview"
    style="display:none;"
    onmouseenter="cancelTransactionHistoryPreviewClose()"
    onmouseleave="scheduleTransactionHistoryPreviewClose()">

    <div class="transaction-history-preview-content">

        <div class="transaction-history-header">

            <span id="transactionHistoryPreviewEmail">
                Transaction History
            </span>

            <button
                class="transaction-history-close"
                onclick="closeTransactionHistoryPreview()">

                &times;

            </button>

        </div>

        <div id="transactionHistoryPreviewBody">
        </div>

    </div>

</div>

</div>

</div>

<script>

/* =========================================================
   STATE
   ========================================================= */

let refunds = [];

let sortField = "filedOn";

let sortDirection = "asc";

let userTransactionHistory = [];

let transactionHistoryByEmail = {};

/* =========================================================
   HOME
   ========================================================= */

function goHome() {

    window.location.href =
        "/internal-dashboard";

}


/* =========================================================
   AMOUNT CONTROL
   ========================================================= */

function updateAmountControls() {

    const operator =
        document.getElementById(
            "amountOperator"
        ).value;

    const amountContainer =
        document.getElementById(
            "amountValue1"
        ).parentElement;

    if (operator === "between") {

        amountContainer.innerHTML = `

            <div
                style="
                    display:grid;
                    grid-template-columns:1fr 1fr;
                    gap:6px;
                ">

                <input
                    id="amountValue1"
                    class="filter-control"
                    type="number"
                    min="0"
                    step="0.01"
                    placeholder="From">

                <input
                    id="amountValue2"
                    class="filter-control"
                    type="number"
                    min="0"
                    step="0.01"
                    placeholder="To">

            </div>

        `;

    } else {

        amountContainer.innerHTML = `

            <input
                id="amountValue1"
                class="filter-control"
                type="number"
                min="0"
                step="0.01"
                placeholder="Amount">

        `;
    }
}


/* =========================================================
   EPOCH CONVERSION
   Browser datetime-local is LOCAL TIME.
   Convert it to epoch seconds for the API.
   ========================================================= */

function localDateToEpoch(
    value
) {

    if (!value) {
        return null;
    }

    const date =
        new Date(value);

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return null;
    }

    return Math.floor(
        date.getTime() / 1000
    );
}


/* =========================================================
   BUILD QUERY PARAMETERS
   ========================================================= */

function buildQueryParams() {

    const params =
        new URLSearchParams();


    const refundId =
        document
            .getElementById(
                "refundId"
            )
            .value
            .trim();

    if (refundId) {

        params.set(
            "refundId",
            refundId
        );
    }


    const email =
        document
            .getElementById(
                "email"
            )
            .value
            .trim();

    if (email) {

        params.set(
            "email",
            email
        );
    }


    const filedOnFrom =
        localDateToEpoch(
            document
                .getElementById(
                    "filedOnFrom"
                )
                .value
        );

    if (filedOnFrom !== null) {

        params.set(
            "filedOnFrom",
            filedOnFrom
        );
    }


    const filedOnTo =
        localDateToEpoch(
            document
                .getElementById(
                    "filedOnTo"
                )
                .value
        );

    if (filedOnTo !== null) {

        params.set(
            "filedOnTo",
            filedOnTo
        );
    }


    const operator =
        document
            .getElementById(
                "amountOperator"
            )
            .value;


    const amount1Element =
        document
            .getElementById(
                "amountValue1"
            );

    const amount1 =
        amount1Element
            ? amount1Element.value
            : "";


    if (amount1 !== "") {

        params.set(
            "amountOperator",
            operator
        );

        params.set(
            "amountValue1",
            amount1
        );


        if (
            operator === "between"
        ) {

            const amount2 =
                document
                    .getElementById(
                        "amountValue2"
                    )
                    .value;

            if (amount2 !== "") {

                params.set(
                    "amountValue2",
                    amount2
                );
            }
        }
    }


    const description =
        document
            .getElementById(
                "description"
            )
            .value
            .trim();

    if (description) {

        params.set(
            "description",
            description
        );
    }


    const status =
        document
            .getElementById(
                "refundStatus"
            )
            .value;

    if (
        status &&
        status !== "all"
    ) {

        params.set(
            "refundStatus",
            status
        );
    }


    return params;
}


/* =========================================================
   APPLY FILTERS
   ========================================================= */

async function applyFilters() {

    const params =
        buildQueryParams();


    /*
     * Initial/default sort is:
     *
     * Filed On ASC
     */

    sortField = "filedOn";
    sortDirection = "asc";


    const tableContainer =
        document.getElementById(
            "tableContainer"
        );

    tableContainer.innerHTML = `

        <div class="loading">
            Loading refunds...
        </div>

    `;


    try {

        const response =
            await fetch(
                `/query-refunds?${params.toString()}`,
                {
                    method: "GET",
                    credentials: "include"
                }
            );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );
        }


        const payload =
            await response.json();


        /*
         * Expected:
         *
         * {
         *   "refunds": [...],
         *   ...
         * }
         */

        refunds =
            payload.refunds || [];

        userTransactionHistory =
            payload.userTransactionHistory || [];

        buildTransactionHistoryIndex();

        /*
         * The backend may return
         * refundAllowed and error
         * for each refund.
         *
         * We preserve those fields
         * unchanged for table rendering.
         */


        sortRefunds();


        renderRefunds();


    } catch (error) {

        console.error(
            "Failed to load refunds:",
            error
        );


        tableContainer.innerHTML = `

            <div class="empty-state">

                Failed to load refunds.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

        document
            .getElementById(
                "resultsCount"
            )
            .textContent =
            "Error";

    }

}


/* =========================================================
   RESET FILTERS
   ========================================================= */

function resetFilters() {

    document
        .getElementById(
            "refundId"
        )
        .value = "";

    document
        .getElementById(
            "email"
        )
        .value = "";

    document
        .getElementById(
            "filedOnFrom"
        )
        .value = "";

    document
        .getElementById(
            "filedOnTo"
        )
        .value = "";

    document
        .getElementById(
            "amountOperator"
        )
        .value = "equal";

    updateAmountControls();

    document
        .getElementById(
            "description"
        )
        .value = "";

    document
        .getElementById(
            "refundStatus"
        )
        .value = "Initiated";


    applyFilters();
}


/* =========================================================
   INITIAL LOAD
   ========================================================= */

window.onload = function() {

    /*
     * Default:
     *
     * refundStatus = Initiated
     *
     * The backend/API can be extended to accept
     * multiple refundStatus parameters:
     *
     * refundStatus=Initiated
     * refundStatus=Approved
     *
     * If your backend expects the comma-separated
     * form, change buildQueryParams accordingly.
     */

    const params =
        new URLSearchParams();

    params.set(
        "refundStatus",
        "Initiated"
    );

    params.append(
        "refundStatus",
        "Approved"
    );


    sortField = "filedOn";
    sortDirection = "asc";


    fetch(
        `/query-refunds?${params.toString()}`,
        {
            method: "GET",
            credentials: "include"
        }
    )
    .then(
        response => {

            if (!response.ok) {

                throw new Error(
                    `HTTP ${response.status}`
                );
            }

            return response.json();

        }
    )
    .then(
        payload => {

            refunds =
                payload.refunds || [];

            userTransactionHistory =
                payload.userTransactionHistory || [];

            buildTransactionHistoryByEmail();

            sortRefunds();

            renderRefunds();

        }
    )
    .catch(
        error => {

            console.error(error);

            document
                .getElementById(
                    "tableContainer"
                )
                .innerHTML = `

                    <div
                        class="empty-state">

                        Failed to load refunds.

                        <br><br>

                        ${escapeHtml(
                            error.message
                        )}

                    </div>

                `;
        }
    );

};

/* =========================================================
   RENDER REFUNDS
   ========================================================= */

function renderRefunds() {

       ----------------------------------------------------- */

       ----------------------------------------------------- */

       ----------------------------------------------------- */

                        onclick="changeSort('refundStatus')">

                            ${getSortIndicator("refundStatus")}
                        </span>
                    </th>

                    <th>
                        Refund Allowed
                    </th>

                    <th>
                        Error / Reason
                    </th>

                    <th>
                        Remarks
                    </th>

                    <th>
                        Action
                    </th>

                </tr>
            </thead>

            <tbody>
    `;


    /* -----------------------------------------------------
       ROWS
       ----------------------------------------------------- */

    refunds.forEach(refund => {

            refund.refundId || "";

        const email =

        const filedOn =

        const refundAmount =
            refund.refundAmount !== undefined &&
            refund.refundAmount !== null
                ? Number(refund.refundAmount).toFixed(2)
                : "";

        const refundDetails =
            refund.refundDetails || {};

        const description =
            refundDetails.refundDescription || "";

        const refundType =
            refundDetails.refundType || "";

        const refundStatus =
            refund.refundStatus || "";

        const refundAllowed =
            refund.refundAllowed || "";

        const error =
            refund.error || "";


        /* -------------------------------------------------
           STATUS CLASS
           ------------------------------------------------- */

        let statusClass = "";

        switch (refundStatus) {

            case "Initiated":
                statusClass = "status-initiated";
                break;

            case "Approved":
                statusClass = "status-approved";
                break;

            case "Settled":
                statusClass = "status-settled";
                break;

            case "Rejected":
                statusClass = "status-rejected";
                break;
        }


        /* -------------------------------------------------
           APPROVE/REJECT/CANCEL BUTTON
           ------------------------------------------------- */

        let actionButtons = "";

        if (refundStatus === "Initiated") {

            // Approve only when refund is allowed
            if (refundAllowed === true) {
                actionButtons += `
                    <button
                        class="approve-btn"
                        onclick="approveRefund(
                            '${escapeHtml(refundId)}'
                        )">

                        Approve

                    </button>
                `;
            }

            // Reject is available for every Initiated refund
            actionButtons += `
                <button
                    class="reject-btn"
                    onclick="rejectRefund(
                        '${escapeHtml(refundId)}'
                    )">

                    Reject

                </button>
            `;

        } else if (refundStatus === "Approved") {

            // Cancel is available for Approved refunds
            actionButtons += `
                <button
                    class="cancel-btn"
                    onclick="cancelRefund(
                        '${escapeHtml(refundId)}'
                    )">

                    Cancel

                </button>
            `;
        }

        /* -------------------------------------------------
        REMARKS
        ------------------------------------------------- */

        const refundRemarks = Array.isArray(refund.refundRemarks)
            ? refund.refundRemarks
            : [];

        const remarksPopupId =
            `remarks-${refundId.replace(/[^a-zA-Z0-9_-]/g, "")}`;

        let remarksHtml = `
            <div class="remarks-cell">

        ------------------------------------------------- */

                    </a>

                <td>

                </td>

                <td>

                </td>

                <td>
                    <div>
                        ${escapeHtml(description)}

                                    style="

                                        color:#94a3b8;

                                    ">
                                    ${escapeHtml(refundType)}
                                </div>
                              `
                            : ""
                    }
                </td>

                <td>
                    <span
                        class="status-badge ${statusClass}">
                        ${escapeHtml(refundStatus)}
                    </span>
                </td>

                <td>
                    ${
                        refundStatus === "Initiated"
                            ? (
                                refundAllowed === true
                                    ? '<span class="status-approved">Yes</span>'
                                    : '<span class="status-rejected">No</span>'
                            )
                            : ""
                    }
                </td>

                <td>
                    ${
                        error
                            ? `
                                <div class="refund-error">
                                    ${escapeHtml(error)}
                                </div>
                              `
                            : ""
                    }
                </td>

                <td>
                    ${remarksHtml}

                    ${remarksPopupHtml}
                </td>

                <td>
                    ${actionButtons}
                </td>

            </tr>
        `;
    });


    html += `
            </tbody>

        </table>
    `;


    tableContainer.innerHTML = html;
}


/* =========================================================
   FILED ON FORMATTING
   ========================================================= */

function formatFiledOn(epochSeconds) {

    if (
        epochSeconds === null ||
        epochSeconds === undefined ||
        epochSeconds === ""
    ) {
        return "";
    }

    const date =
        new Date(
            Number(epochSeconds) * 1000
        );

    if (Number.isNaN(date.getTime())) {
        return "";
    }

    return date.toLocaleString();
}


/* =========================================================
   SORT INDICATOR
   ========================================================= */

function getSortIndicator(field) {

    if (sortField !== field) {
        return "";
    }

    return sortDirection === "asc"
        ? "▲"
        : "▼";
}


/* =========================================================
   CHANGE SORT
   ========================================================= */

function changeSort(field) {

    if (sortField === field) {

        sortDirection =
            sortDirection === "asc"
                ? "desc"
                : "asc";

    } else {

        sortField = field;
        sortDirection = "asc";
    }

    sortRefunds();

    renderRefunds();
}

/* =========================================================
   SORT
   ========================================================= */

function sortRefunds() {

    refunds.sort(
        (a, b) => {

            let av;
            let bv;


            if (
                sortField === "filedOn"
            ) {

                av =
                    Number(
                        a.filedOn || 0
                    );

                bv =
                    Number(
                        b.filedOn || 0
                    );

            } else if (
                sortField ===
                "refundAmount"
            ) {

                av =
                    Number(
                        a.refundAmount || 0
                    );

                bv =
                    Number(
                        b.refundAmount || 0
                    );

            } else if (
                sortField ===
                "refundStatus"
            ) {

                av =
                    String(
                        a.refundStatus || ""
                    ).toLowerCase();

                bv =
                    String(
                        b.refundStatus || ""
                    ).toLowerCase();

            }


            if (av < bv) {

                return sortDirection ===
                    "asc"
                    ? -1
                    : 1;
            }

            if (av > bv) {

                return sortDirection ===
                    "asc"
                    ? 1
                    : -1;
            }

            return 0;
        }
    );
}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}

/* =========================================================
   Show/Hide Remarks Modal
   ========================================================= */

function showRemarks(modalId) {

    const modal = document.getElementById(modalId);

    if (modal) {
        modal.style.display = "flex";
    }
}

function closeRemarks(modalId) {

    const modal = document.getElementById(modalId);

    if (modal) {
        modal.style.display = "none";
    }
}

document.addEventListener("click", function(event) {

    if (event.target.classList.contains("remarks-modal")) {
        event.target.style.display = "none";
    }

});

function formatRemarkTimestamp(timestamp) {

    if (!timestamp) {
        return "";
    }

    const value = Number(timestamp);

    if (!Number.isFinite(value)) {
        return String(timestamp);
    }

    // Handle epoch seconds
    const date = new Date(
        value < 10000000000
            ? value * 1000
            : value
    );

    if (Number.isNaN(date.getTime())) {
        return String(timestamp);
    }

    return date.toLocaleString();
}

function getNewRefundRemark(refundId) {

    const input = document.getElementById(
        `new-remark-${refundId}`
    );

    if (!input) {
        return "";
    }

    return input.value.trim();
}

/* =========================================================
   User transaction history
   ========================================================= */

function buildTransactionHistoryIndex() {

    transactionHistoryByEmail = {};

    userTransactionHistory.forEach(transaction => {

        const email = transaction.email;

        if (!email) {
            return;
        }

        if (!transactionHistoryByEmail[email]) {
            transactionHistoryByEmail[email] = [];
        }

        transactionHistoryByEmail[email].push(transaction);
    });
}

function buildTransactionHistoryTable(email) {

    const transactions =
        transactionHistoryByEmail[email] || [];

    if (transactions.length === 0) {

        return `
            <div class="no-transaction-history">
                No transaction history available.
            </div>
        `;
    }

    // Newest transaction first
    const sortedTransactions = [...transactions].sort(
        (a, b) =>
            Number(b.transactionTimestamp || 0) -
            Number(a.transactionTimestamp || 0)
    );

    let html = `
        <table class="transaction-history-table">

            <thead>
                <tr>

                    <th>
                        Date / Time
                    </th>

                    <th>
                        Transaction ID
                    </th>

                    <th>
                        Type
                    </th>

                    <th>
                        Amount
                    </th>

                    <th>
                        Status
                    </th>

                </tr>
            </thead>

            <tbody>
    `;

    sortedTransactions.forEach(transaction => {

        const timestamp =
            transaction.transactionTimestamp;

        const transactionId =
            transaction.transactionId || "";

        const transactionType =
            transaction.transactionType || "";

        const transactionAmount =
            Number(transaction.transactionAmount || 0);

        const transactionStatus =
            transaction.transactionStatus || "";

        html += `
            <tr>

                <td>
                    ${escapeHtml(
                        formatTransactionTimestamp(timestamp)
                    )}
                </td>

                <td>
                    ${escapeHtml(transactionId)}
                </td>

                <td>
                    ${escapeHtml(transactionType)}
                </td>

                <td class="${
                    transactionAmount < 0
                        ? "transaction-debit"
                        : "transaction-credit"
                }">

                    ₹${escapeHtml(
                        formatTransactionAmount(
                            transactionAmount
                        )
                    )}

                </td>

                <td>
                    ${escapeHtml(transactionStatus)}
                </td>

            </tr>
        `;
    });

    html += `
            </tbody>

        </table>
    `;

    return html;
}

function formatTransactionTimestamp(timestamp) {

    if (timestamp === null ||
        timestamp === undefined ||
        timestamp === "") {

        return "";
    }

    const value = Number(timestamp);

    if (!Number.isFinite(value)) {
        return String(timestamp);
    }

    const date = new Date(
        value < 10000000000
            ? value * 1000
            : value
    );

    if (Number.isNaN(date.getTime())) {
        return String(timestamp);
    }

    return date.toLocaleString();
}

function formatTransactionAmount(amount) {

    return Number(amount).toLocaleString(
        "en-IN",
        {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }
    );
}

        return;

    emailElement.textContent =
        `Transaction History - ${email}`;

    bodyElement.innerHTML =
        buildTransactionHistoryTable(email);

    modal.style.display = "flex";
}

function scheduleTransactionHistoryPreviewClose() {

    cancelTransactionHistoryPreviewClose();

    transactionHistoryCloseTimer =
        setTimeout(() => {

            closeTransactionHistoryPreview();

        }, 250);
}

function cancelTransactionHistoryPreviewClose() {

    if (transactionHistoryCloseTimer) {

        clearTimeout(
            transactionHistoryCloseTimer
        );

        transactionHistoryCloseTimer = null;
    }
}

function closeTransactionHistoryPreview() {

    cancelTransactionHistoryPreviewClose();

    const modal =
        document.getElementById(

    if (modal) {
        modal.style.display = "none";

}
